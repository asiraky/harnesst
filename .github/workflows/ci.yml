name: CI

# Runs the type checker and unit test suite on every pull request. These are the
# same checks that will eventually be gated inside the deployment pipeline; until
# that exists, we run them here so nothing merges without passing them.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:composed

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `catalog/index.json` is generated and carries a content hash per template, so a manifest
      # edit committed without `npm run catalog:index` surfaces in the suite as an opaque hash
      # mismatch. Validate first: it names the template and the rule that was broken.
      - run: npm run catalog:validate
      # Frontmatter of shipped markdown + the catalog ↔ capability-registry cross-check. Neither has
      # a function under test, so they are a lint rather than a test (issue #273) — but unparseable
      # skill frontmatter hard-fails the eve image build, so it must still gate merge.
      - run: npm run lint:shipped
      - run: npm test

  # The production Docker build runs `npm run build`; typecheck + tests do not exercise the
  # Vite client/server split, so a server-only import leaking into the client bundle passes CI
  # yet breaks every deploy. Build here to catch that class of error before merge.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
