# Adapt the build/deploy commands and set repository variable CLOUDFLARE_WORKER_URL.
# Both this workflow and ledger.yml must be installed on the default branch.
name: Deploy approved ledger change
on:
  repository_dispatch:
    types: [ledger-deploy]
permissions:
  contents: write
  pull-requests: read
  deployments: write
concurrency:
  group: ledger-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify merged revision and record deployment
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload.client_payload;
            if (!p || !/^[0-9a-f]{40}$/.test(p.head_sha) || !/^[0-9a-f]{40}$/.test(p.merge_sha) ||
                !/^[0-9a-f-]{36}$/.test(p.ledger_item_id) || !Number.isSafeInteger(p.pull_request))
              throw new Error('Invalid deployment request');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number:p.pull_request});
            if (!pr.merged || pr.head.sha !== p.head_sha || pr.merge_commit_sha !== p.merge_sha ||
                pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`)
              throw new Error('Deployment must match the confirmed approved merge');
            const {data: repo} = await github.rest.repos.get(context.repo);
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch:repo.default_branch});
            if (branch.commit.sha !== p.merge_sha) throw new Error('Superseded merge; refusing to roll production back');
            const {data: deployment} = await github.rest.repos.createDeployment({
              ...context.repo, ref:p.merge_sha, environment:'production', auto_merge:false,
              required_contexts:[], payload:p, production_environment:true,
            });
            if (!deployment.id) throw new Error('Deployment record not created');
            core.setOutput('deployment_id', deployment.id);
            core.setOutput('merge_sha', p.merge_sha);
            await github.rest.repos.createDeploymentStatus({...context.repo, deployment_id:deployment.id, state:'in_progress'});
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.prepare.outputs.merge_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - name: Deploy and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: |
          test -n "$WORKER_URL"
          npx wrangler deploy
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$WORKER_URL" -o /dev/null
      - name: Report outcome and wake ledger integration
        if: always() && steps.prepare.outputs.deployment_id
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.prepare.outputs.deployment_id }}
          DEPLOY_RESULT: ${{ job.status }}
          WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        with:
          script: |
            const deployment_id = Number(process.env.DEPLOYMENT_ID);
            const success = process.env.DEPLOY_RESULT === 'success';
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id, state:success ? 'success' : 'failure',
              ...(success ? {environment_url:process.env.WORKER_URL} : {}),
            });
            // GITHUB_TOKEN also suppresses deployment_status-triggered workflows.
            if (success) await github.rest.repos.createDispatchEvent({
              ...context.repo, event_type:'ledger-deployed', client_payload:{deployment_id},
            });
