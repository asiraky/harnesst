name: harnesst-ledger-prototype
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ledger-local-only
      POSTGRES_DB: ledger
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["ledger-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  ledger-data:
