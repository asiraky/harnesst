name: Ledger
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  deployment_status:
  repository_dispatch:
    types: [ledger-deployed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  deployments: read
jobs:
  ledger:
    # Enable after the three ledger secrets have been configured.
    if: vars.LEDGER_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Only trusted default-branch code. Never checkout or run pull-request code here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node .github/scripts/ledger.mjs
        env:
          LEDGER_URL: ${{ secrets.LEDGER_URL }}
          LEDGER_ANON_KEY: ${{ secrets.LEDGER_ANON_KEY }}
          LEDGER_ACTOR_KEY: ${{ secrets.LEDGER_ACTOR_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
