# Nginx site for harnesst on a single VPS, served by the `nginx` container in this stack. Compose
# mounts this file at /etc/nginx/conf.d/default.conf. Replace eden.example.com with your domain
# (README step 6). certbot (also containerized) writes ACME challenges to /var/www/certbot and
# certs to /etc/letsencrypt — both shared volumes; there is no host nginx/certbot.
#
# Two upstreams on the same host (reached over loopback thanks to host networking):
#  - harnesst itself (the dashboard + API)      → 127.0.0.1:3000
#  - the environment ingress ("splitter",   → 127.0.0.1:8787
#    serves agent channel traffic at /e/<environmentId>/...)
#
# Both stream (SSE: assistant, playground, agent sessions), hence proxy_buffering off and the
# long read timeout — with buffering on, streamed tokens sit in nginx until the response ends.

# Never persist query strings or Referer values: password-reset callbacks carry a one-time token
# in the query. The Better Auth callback endpoint carries its token in the path and is disabled
# separately below. Keep this format query-free if adding fields later.
log_format eden_sanitized '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_user_agent"';

# Port 80: serve ACME challenges over the webroot, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name eden.example.com;
    # Override nginx.conf's inherited `main` log rather than adding a second unsafe log.
    access_log /var/log/nginx/access.log eden_sanitized;
    # Nginx error records include the raw request target. Query credentials can be nested in
    # returnTo/callback parameters on otherwise generic routes, so durable request logging lives in
    # the sanitized access log and harnesst's token-redacted application log instead.
    error_log /dev/null emerg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Better Auth puts the reset token in this path. Do not log it even for an HTTP redirect.
    # Unslashed prefix, matching the 443 block below — see the note there.
    location ^~ /api/auth/reset-password {
        access_log off;
        error_log /dev/null emerg;
        return 301 https://$host$request_uri;
    }

    location = /reset-password {
        error_log /dev/null emerg;
        return 301 https://$host$request_uri;
    }

    location = /api/auth/verify-email {
        error_log /dev/null emerg;
        return 301 https://$host$request_uri;
    }

    location ^~ /accept-invitation {
        access_log off;
        error_log /dev/null emerg;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eden.example.com;
    # Override nginx.conf's inherited `main` log rather than adding a second unsafe log.
    access_log /var/log/nginx/access.log eden_sanitized;
    # See the port-80 server: nginx's raw-target error format cannot safely retain callback URLs.
    error_log /dev/null emerg;

    ssl_certificate     /etc/letsencrypt/live/eden.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eden.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Agent ingest payloads and publish requests can carry file contents.
    client_max_body_size 25m;

    # Post-login response headers can overflow nginx's default proxy header buffer (4k/8k)
    # -> "upstream sent too big header" -> 502. These govern the header read even with
    # proxy_buffering off, so they are load-bearing, not tuning.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Agent channel traffic → the weighted, session-sticky splitter.
    location /e/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Everything else → harnesst.
    # Better Auth puts the reset token in this callback path. It must reach harnesst unchanged, but
    # must never be written to nginx's access log.
    #
    # The prefix deliberately carries NO trailing slash. Nginx gives a prefix location that ends in
    # `/` and is served by proxy_pass special treatment: a request for exactly that string *without*
    # the slash gets a 301 to the slashed form. `/api/auth/reset-password` is precisely that URI —
    # it is the endpoint the reset form POSTs the new password to — and browsers re-issue a 301'd
    # POST as a bodyless GET, which then matches no route and 404s. The reset appears to submit and
    # silently never happens. Matching the bare path keeps both it and the token path on harnesst.
    location ^~ /api/auth/reset-password {
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # These callbacks carry one-time tokens in the query string. The access format omits queries;
    # suppress location-level error logging as well so an upstream outage cannot copy the URI.
    location = /reset-password {
        error_log /dev/null emerg;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /api/auth/verify-email {
        error_log /dev/null emerg;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Invitation IDs are mailbox capabilities. Verification is still required by Better Auth,
    # but the opaque ID has no operational value in proxy logs. Unslashed for the reason above.
    location ^~ /accept-invitation {
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, rather than append to, client-supplied IP headers. Better Auth reads this
        # single nginx-owned value for its production rate limiter.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# ── Optional marketing host ─────────────────────────────────────────────────────────────────
# Only needed when MARKETING_HOST is set in harnesst's env (the editorial landing + case studies on
# their own subdomain while `/` on the app host is Front of House). harnesst itself branches on the
# forwarded Host header, so both vhosts proxy to the same upstream. To enable: replace
# www.eden.example.com with your MARKETING_HOST value, add a DNS A record for it, and extend the
# certificate to cover it (certbot certonly ... -d eden.example.com -d www.eden.example.com —
# both names share the eden.example.com lineage below). Delete this pair of server blocks if you
# don't run the marketing site.
server {
    listen 80;
    listen [::]:80;
    server_name www.eden.example.com;
    access_log /var/log/nginx/access.log eden_sanitized;
    error_log /dev/null emerg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eden.example.com;
    access_log /var/log/nginx/access.log eden_sanitized;
    error_log /dev/null emerg;

    ssl_certificate     /etc/letsencrypt/live/eden.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eden.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # The marketing surface is GET-only pages, but the headers stay identical to the app
    # vhost: Better Auth rate-limits on the single nginx-owned X-Real-IP value, and harnesst's
    # host-split redirects rely on the forwarded Host.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
